[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-system"
version = "0.1.0"
description = "Modular AI-powered quantitative trading system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Abel Miracle", email = "abelmiracle377@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy==1.26.4",
    "pyarrow==23.0.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "joblib==1.4.2",
    "yfinance==0.2.43",
    "ta==0.11.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.2.3",
    "loguru==0.7.2",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "plotly==5.24.1",
    "alpaca-py==0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "build==1.3.0",
    "pre-commit==3.8.0",
    "types-PyYAML==6.0.12.20240808",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
