<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AI Trading System architecture</title>
<desc id="desc">A visual architecture showing market data flowing through validation, features, machine learning, strategy, risk, and paper execution with experiment tracking and monitoring.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".25"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="60" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">AI Trading System</text>
<text x="60" y="91" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Research → signal → deterministic risk gate → paper execution</text>

<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
  <rect x="55" y="150" width="180" height="100" rx="18" fill="#172033" stroke="#334155"/>
  <text x="75" y="185" fill="#93c5fd" font-size="13" font-weight="700">01</text>
  <text x="75" y="213" fill="#f8fafc" font-size="18" font-weight="700">Market Data</text>
  <text x="75" y="236" fill="#94a3b8" font-size="12">OHLCV · cache · checks</text>

  <rect x="275" y="150" width="180" height="100" rx="18" fill="#172033" stroke="#334155"/>
  <text x="295" y="185" fill="#93c5fd" font-size="13" font-weight="700">02</text>
  <text x="295" y="213" fill="#f8fafc" font-size="18" font-weight="700">Features</text>
  <text x="295" y="236" fill="#94a3b8" font-size="12">Indicators · returns · stats</text>

  <rect x="495" y="150" width="180" height="100" rx="18" fill="#172033" stroke="#334155"/>
  <text x="515" y="185" fill="#a78bfa" font-size="13" font-weight="700">03</text>
  <text x="515" y="213" fill="#f8fafc" font-size="18" font-weight="700">ML Signal</text>
  <text x="515" y="236" fill="#94a3b8" font-size="12">Train · probability · signal</text>

  <rect x="715" y="150" width="180" height="100" rx="18" fill="#172033" stroke="#334155"/>
  <text x="735" y="185" fill="#c4b5fd" font-size="13" font-weight="700">04</text>
  <text x="735" y="213" fill="#f8fafc" font-size="18" font-weight="700">Risk Gate</text>
  <text x="735" y="236" fill="#94a3b8" font-size="12">Loss · DD · leverage · size</text>

  <rect x="935" y="150" width="210" height="100" rx="18" fill="#172033" stroke="#334155"/>
  <text x="955" y="185" fill="#86efac" font-size="13" font-weight="700">05</text>
  <text x="955" y="213" fill="#f8fafc" font-size="18" font-weight="700">Paper Execution</text>
  <text x="955" y="236" fill="#94a3b8" font-size="12">Broker state · orders · audit</text>
</g>

<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
  <path d="M235 200 H270"/><path d="M455 200 H490"/><path d="M675 200 H710"/><path d="M895 200 H930"/>
</g>

<rect x="55" y="310" width="1090" height="145" rx="20" fill="#0f172a" stroke="#263449"/>
<text x="80" y="343" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Control plane</text>
<g font-family="Inter,Arial,sans-serif">
  <rect x="80" y="365" width="230" height="58" rx="12" fill="#111c31"/>
  <text x="100" y="390" fill="#f8fafc" font-size="14" font-weight="700">Experiment Tracking</text>
  <text x="100" y="410" fill="#64748b" font-size="11">run IDs · model metadata · metrics</text>
  <rect x="330" y="365" width="230" height="58" rx="12" fill="#111c31"/>
  <text x="350" y="390" fill="#f8fafc" font-size="14" font-weight="700">Research Integrity</text>
  <text x="350" y="410" fill="#64748b" font-size="11">walk-forward · leakage tests · validation</text>
  <rect x="580" y="365" width="230" height="58" rx="12" fill="#111c31"/>
  <text x="600" y="390" fill="#f8fafc" font-size="14" font-weight="700">Automation</text>
  <text x="600" y="410" fill="#64748b" font-size="11">GitHub Actions · scheduled paper runs</text>
  <rect x="830" y="365" width="290" height="58" rx="12" fill="#111c31"/>
  <text x="850" y="390" fill="#f8fafc" font-size="14" font-weight="700">Security &amp; Quality</text>
  <text x="850" y="410" fill="#64748b" font-size="11">Ruff · mypy · pytest · Bandit · pip-audit</text>
</g>
<text x="60" y="490" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">Illustrative system architecture — not a performance chart.</text>
</svg>