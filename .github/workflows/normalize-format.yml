name: Normalize Ruff formatting

on:
  push:
    branches: [hardening/datafactor-readiness]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff==0.6.8"
      - name: Format
        run: ruff format src/ tests/ main.py scripts/
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ tests/ main.py scripts/
          git commit -m "style: normalize Ruff formatting"
          git push
