name: Trading Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "paper"
        type: choice
        options:
          - paper
          - live
  schedule:
    # Scheduled runs remain paper trading by default.
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  trading-agent:
    name: Run ${{ inputs.mode == 'live' && 'live' || 'paper' }} trading agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'paper' }}
      ALPACA_API_KEY: ${{ inputs.mode == 'live' && secrets.ALPACA_LIVE_API_KEY || secrets.ALPACA_PAPER_API_KEY }}
      ALPACA_API_SECRET: ${{ inputs.mode == 'live' && secrets.ALPACA_LIVE_API_SECRET || secrets.ALPACA_PAPER_API_SECRET }}
      ALLOW_LIVE_TRADING: ${{ inputs.mode == 'live' && secrets.LIVE_TRADING_APPROVED || 'NO' }}
      SIGNAL_WEBHOOK_URL: ${{ secrets.SIGNAL_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore learning state
        uses: actions/cache@v4
        with:
          path: data/runtime/learning
          key: trading-learning-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            trading-learning-v1-${{ github.ref_name }}-

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Analyze stock and crypto markets
        run: |
          if [ -n "$SIGNAL_WEBHOOK_URL" ]; then
            python scripts/analyze_market.py --send
          else
            python scripts/analyze_market.py
          fi
          echo "Generated signals:"
          cat data/runtime/signals/latest.jsonl

      - name: Analyze open trades
        run: |
          if [ "$MODE" = "live" ]; then
            python scripts/monitor_live_trades.py --live
          else
            python scripts/monitor_live_trades.py
          fi

      - name: Run selected trading cycle
        run: |
          if [ "$MODE" = "live" ]; then
            if [ "$ALLOW_LIVE_TRADING" != "YES" ]; then
              echo "Live mode selected but LIVE_TRADING_APPROVED is not YES. Refusing live execution."
              exit 1
            fi
            python scripts/run_trading_agent.py --live
          else
            python scripts/run_trading_agent.py
          fi

      - name: Verify agent health
        if: success()
        run: python scripts/check_health.py --max-age-hours 36

      - name: Upload agent logs and signals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trading-agent-logs-${{ github.run_id }}
          path: |
            logs/
            data/runtime/
          if-no-files-found: ignore
          retention-days: 14
