services:
  - type: cron
    name: trade-bot-paper-agent
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    schedule: "30 21 * * 1-5"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/run_trading_agent.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALLOW_LIVE_TRADING
        value: "NO"
      - key: PYTHONUNBUFFERED
        value: "1"
